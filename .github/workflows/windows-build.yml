name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Produktionsplanung.sln

      - name: Build
        run: dotnet build Produktionsplanung.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false --output artifacts/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: produktionsplanung-win-x64
          path: artifacts/win-x64
