name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Invalid release tag" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Produktionsplanung.sln

      - name: Regression tests (isolated SQLite and WPF)
        run: dotnet run --project tests/Produktionsplanung.RegressionTests --configuration Release

      - name: Publish standalone Windows x64
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=$version --output artifacts/win-x64

      - name: Publish portable single-file Windows x64
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$version --output artifacts/single-file
          $source = Join-Path $PWD "artifacts/single-file/OpsCompact.exe"
          $target = Join-Path $PWD "artifacts/OpsCompact-$version-win-x64-portable.exe"
          if (-not (Test-Path $source)) { throw "Single-file executable not found: $source" }
          Copy-Item $source $target -Force

      - name: Prepare USB portable package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $usb = Join-Path $PWD "artifacts/usb-portable"
          New-Item -ItemType Directory -Path $usb -Force | Out-Null
          Copy-Item "artifacts/OpsCompact-$version-win-x64-portable.exe" (Join-Path $usb "OpsCompact.exe") -Force
          Set-Content -Path (Join-Path $usb "portable.mode") -Value "OpsCompact USB portable mode" -Encoding UTF8
          @"
          OpsCompact USB / Portable
          =========================

          Gesamten Ordner auf einen USB-Stick oder in einen beschreibbaren Ordner kopieren und OpsCompact.exe starten.
          Die Datei portable.mode aktiviert den USB-Modus und darf nicht gelöscht werden.

          Im USB-Modus bleiben die Daten beim Programm:
          - produktionsplanung.db direkt neben OpsCompact.exe
          - settings.json direkt neben OpsCompact.exe
          - Backups im Unterordner Backups
          - Exporte im Unterordner Exports

          Der bestehende Datenpfad %LOCALAPPDATA%\Produktionsplanung bleibt aus Kompatibilitätsgründen erhalten.
          "@ | Set-Content -Path (Join-Path $usb "README-PORTABLE.txt") -Encoding UTF8
          Compress-Archive -Path "$usb/*" -DestinationPath "artifacts/OpsCompact-$version-win-x64-USB-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" "installer\OpsCompact.iss"

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath "artifacts/OpsCompact-$version-win-x64-portable.zip" -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem artifacts/installer/OpsCompact-Setup-*.exe | Select-Object -First 1
          $portableZip = "artifacts/OpsCompact-$version-win-x64-portable.zip"
          $portableExe = "artifacts/OpsCompact-$version-win-x64-portable.exe"
          $usbPortable = "artifacts/OpsCompact-$version-win-x64-USB-portable.zip"
          gh release create "${{ github.ref_name }}" $installer.FullName $portableZip $portableExe $usbPortable --generate-notes --title "OpsCompact ${{ github.ref_name }}"

      - name: Update latest downloads folder on main
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem artifacts/installer/OpsCompact-Setup-*.exe | Select-Object -First 1
          $portableZip = Resolve-Path "artifacts/OpsCompact-$version-win-x64-portable.zip"
          $installerCopy = Join-Path $env:RUNNER_TEMP "OpsCompact-Setup-latest.exe"
          $portableCopy = Join-Path $env:RUNNER_TEMP "OpsCompact-portable-latest.zip"
          Copy-Item $installer.FullName $installerCopy -Force
          Copy-Item $portableZip $portableCopy -Force

          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Path downloads -Force | Out-Null
          Copy-Item $installerCopy "downloads/OpsCompact-Setup-latest.exe" -Force
          Copy-Item $portableCopy "downloads/OpsCompact-portable-latest.zip" -Force
          Set-Content -Path "downloads/VERSION.txt" -Value "$version`nBuilt from tag ${{ github.ref_name }}" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/OpsCompact-Setup-latest.exe downloads/OpsCompact-portable-latest.zip downloads/VERSION.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update latest downloads to ${{ github.ref_name }}"
            git push origin main
          }
