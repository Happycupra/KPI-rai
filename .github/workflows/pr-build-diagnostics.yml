name: PR Build Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-diagnostics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore Produktionsplanung.sln
      - name: Capture build output
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Produktionsplanung.sln --configuration Release --no-restore 2>&1 | Tee-Object -FilePath build-diagnostics.txt
          exit $LASTEXITCODE
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-diagnostics
          path: build-diagnostics.txt
          if-no-files-found: error
      - name: Fail when compile failed
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        run: exit 1
