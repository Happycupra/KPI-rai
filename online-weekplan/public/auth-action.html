<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>SolutionCompakt · Passwort</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#102a43;background:#f4f7fa}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:7vh auto;padding:18px}
    .card{background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:24px;box-shadow:0 5px 18px rgba(16,42,67,.06)}
    h1{margin:0 0 8px}.sub{color:#627d98;margin-bottom:18px}label{display:block;font-weight:650;margin:12px 0 5px}
    input,button{font:inherit}input{width:100%;padding:11px 12px;border:1px solid #bcccdc;border-radius:9px}
    button{width:100%;margin-top:16px;border:1px solid #1261a0;border-radius:9px;padding:11px 13px;background:#1261a0;color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#fff;color:#102a43;border-color:#9fb3c8}.status{margin-top:14px;min-height:24px;color:#b42318}.ok{color:#166534}.hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>SolutionCompakt</h1>
    <div class="sub">Passwort für die Lizenzverwaltung festlegen.</div>
    <div id="loading">Link wird geprüft…</div>
    <div id="form" class="hidden">
      <div id="emailText" class="sub"></div>
      <label for="password">Neues Passwort</label>
      <input id="password" type="password" autocomplete="new-password" minlength="10">
      <label for="confirm">Passwort bestätigen</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="10">
      <button id="saveButton">Passwort speichern</button>
    </div>
    <div id="done" class="hidden">
      <div class="status ok">Passwort wurde gespeichert.</div>
      <button id="backButton" class="secondary">Zur Admin-Anmeldung</button>
    </div>
    <div id="status" class="status"></div>
  </div></div>
  <script type="module" src="auth-action.js"></script>
</body>
</html>
