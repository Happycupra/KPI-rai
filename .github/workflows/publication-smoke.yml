name: Verify direct online publication
on:
  push:
    branches: [diagnostics/publication-20260928]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: online-weekplan/functions
      - name: Verify isolated publication and server timestamp
        working-directory: online-weekplan/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPACT || secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPAKT || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node publication-smoke.cjs
