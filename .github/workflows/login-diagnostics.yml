name: Diagnose login server errors
on:
  push:
    branches: [diagnostics/login-500-20260928]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: online-weekplan/functions
      - name: Classify recent login errors without exporting raw logs
        working-directory: online-weekplan/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPACT || secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPAKT || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const credentials=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const auth=new GoogleAuth({credentials,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const since=new Date(Date.now()-3*3600000).toISOString();
            const r=await client.request({url:'https://logging.googleapis.com/v2/entries:list',method:'POST',data:{
              resourceNames:['projects/solution-compact'],
              filter:'resource.type="cloud_run_revision" AND resource.labels.service_name="login" AND severity>=ERROR AND timestamp>="'+since+'"',
              orderBy:'timestamp desc',pageSize:30
            }});
            console.log('Matching error entries:',(r.data.entries||[]).length);
            for(const entry of r.data.entries||[]){
              const message=entry.textPayload||JSON.stringify(entry.jsonPayload||{});
              console.log(JSON.stringify({
                timestamp:entry.timestamp,
                codes:[...new Set(message.match(/auth\/[a-z-]+/g)||[])],
                signBlob:/signBlob/i.test(message),
                tokenCreation:/createCustomToken|signJwt|signBlob|IAMSigner/i.test(message),
                permissionDenied:/permission.denied|insufficient.permission|PERMISSION_DENIED|permission.*required/i.test(message),
                iamApiDisabled:/iamcredentials.*disabled|IAM.*API.*not.*enabled/i.test(message),
                invalidUid:/invalid.uid|uid.*128/i.test(message),
                invalidClaims:/invalid.claims|reserved.claims|claims.*undefined/i.test(message),
                firestore:/Firestore|firestore|FAILED_PRECONDITION/i.test(message),
                passwordHash:/pbkdf2|ERR_OUT_OF_RANGE|ERR_INVALID_ARG_TYPE/i.test(message)
              }));
            }
            const f=await client.request({url:'https://cloudfunctions.googleapis.com/v2/projects/solution-compact/locations/europe-west1/functions/login'});
            console.log('Login runtime account:',f.data.serviceConfig?.serviceAccountEmail);
          })().catch(e=>{console.error('Diagnostic failed:',e.response?.status||e.code,e.response?.data?.error?.status||'');process.exitCode=1});
          NODE
