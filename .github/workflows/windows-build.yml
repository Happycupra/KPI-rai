name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Produktionsplanung.sln

      - name: Build
        run: dotnet build Produktionsplanung.sln --configuration Release --no-restore

      - name: Regression tests (isolated SQLite and WPF)
        run: dotnet run --project tests/Produktionsplanung.RegressionTests --configuration Release

      - name: Publish standalone Windows x64
        run: dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output artifacts/win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=0.1.0" "installer\KPI-rai.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: produktionsplanung-win-x64
          path: artifacts/win-x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KPI-rai-Setup-0.1.0-win-x64
          path: artifacts/installer/*.exe
