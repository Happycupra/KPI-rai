name: Repair and verify login signing
on:
  push:
    branches: [diagnostics/login-500-20260928]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/login-signing.test.cjs
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: online-weekplan/functions
      - name: Write temporary deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPACT || secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPAKT || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Configure scoped runtime signing permission
        working-directory: online-weekplan/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node configure-login-signing.js
      - name: Verify production login with isolated temporary records
        working-directory: online-weekplan/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPACT || secrets.FIREBASE_SERVICE_ACCOUNT_SOLUTION_COMPAKT || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cp ../public/config.json public-config-diagnostic.json
          node smoke-test-login.cjs
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
