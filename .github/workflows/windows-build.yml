name: Windows Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'downloads/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
  WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
  BUILD_VERSION: 1.0.${{ github.run_number }}

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node for Firebase web validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase-ready web app
        shell: pwsh
        run: |
          node --check online-weekplan/functions/index.js
          node --check online-weekplan/functions/bootstrap-owner-admin.js
          node --check online-weekplan/public/app.js
          node --check online-weekplan/public/admin.js
          node --test tests/online-weekplan.test.cjs
          Get-Content online-weekplan/firebase.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content online-weekplan/public/config.example.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content online-weekplan/public/config.json -Raw | ConvertFrom-Json | Out-Null
          Push-Location online-weekplan/functions
          try {
            npm install --ignore-scripts --no-audit --no-fund
          }
          finally {
            Pop-Location
          }

      - name: Restore
        run: dotnet restore Produktionsplanung.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build Produktionsplanung.sln --configuration Release --no-restore `
            -p:VersionPrefix=$env:BUILD_VERSION `
            -p:AssemblyVersion="$env:BUILD_VERSION.0" `
            -p:FileVersion="$env:BUILD_VERSION.0" `
            -p:InformationalVersion=$env:BUILD_VERSION

      - name: Regression tests (isolated SQLite and WPF)
        run: dotnet run --project tests/Produktionsplanung.RegressionTests --configuration Release

      - name: Publish standalone Windows x64
        shell: pwsh
        run: |
          dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:VersionPrefix=$env:BUILD_VERSION `
            -p:AssemblyVersion="$env:BUILD_VERSION.0" `
            -p:FileVersion="$env:BUILD_VERSION.0" `
            -p:InformationalVersion=$env:BUILD_VERSION `
            --output artifacts/win-x64

      - name: Publish portable single-file Windows x64
        shell: pwsh
        run: |
          dotnet publish src/Produktionsplanung.App/Produktionsplanung.App.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:VersionPrefix=$env:BUILD_VERSION `
            -p:AssemblyVersion="$env:BUILD_VERSION.0" `
            -p:FileVersion="$env:BUILD_VERSION.0" `
            -p:InformationalVersion=$env:BUILD_VERSION `
            --output artifacts/single-file
          $exe = Join-Path $PWD "artifacts/single-file/SolutionCompakt.exe"
          if (-not (Test-Path $exe)) { throw "Single-file executable not found: $exe" }

      - name: Sign application executables
        if: ${{ env.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "solutioncompakt-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            ./scripts/Sign-WindowsArtifacts.ps1 `
              -CertificatePath $certPath `
              -CertificatePassword $env:WINDOWS_SIGNING_PFX_PASSWORD `
              -Paths @(
                "artifacts/win-x64/SolutionCompakt.exe",
                "artifacts/single-file/SolutionCompakt.exe"
              )
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare USB portable package
        shell: pwsh
        run: |
          $usb = Join-Path $PWD "artifacts/usb-portable"
          New-Item -ItemType Directory -Path $usb -Force | Out-Null
          Copy-Item "artifacts/single-file/SolutionCompakt.exe" (Join-Path $usb "SolutionCompakt.exe") -Force
          Set-Content -Path (Join-Path $usb "portable.mode") -Value "SolutionCompakt USB portable mode" -Encoding UTF8
          @"
          SolutionCompakt USB / Portable
          ==============================

          Gesamten Ordner auf einen USB-Stick oder in einen beschreibbaren Ordner kopieren und SolutionCompakt.exe starten.
          Die Datei portable.mode aktiviert den USB-Modus und darf nicht gelöscht werden.

          Im USB-Modus bleiben die Daten beim Programm:
          - produktionsplanung.db direkt neben SolutionCompakt.exe
          - settings.json direkt neben SolutionCompakt.exe
          - Backups im Unterordner Backups
          - Exporte im Unterordner Exports
          "@ | Set-Content -Path (Join-Path $usb "README-PORTABLE.txt") -Encoding UTF8

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$env:BUILD_VERSION" "installer\SolutionCompakt.iss"

      - name: Sign installer
        if: ${{ env.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "solutioncompakt-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            ./scripts/Sign-WindowsArtifacts.ps1 `
              -CertificatePath $certPath `
              -CertificatePassword $env:WINDOWS_SIGNING_PFX_PASSWORD `
              -Paths @("artifacts/installer/*.exe")
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: SolutionCompakt-Windows-${{ env.BUILD_VERSION }}-win-x64
          path: artifacts/win-x64

      - name: Upload portable single EXE
        uses: actions/upload-artifact@v4
        with:
          name: SolutionCompakt-Portable-${{ env.BUILD_VERSION }}-win-x64
          path: artifacts/single-file/SolutionCompakt.exe

      - name: Upload USB portable package
        uses: actions/upload-artifact@v4
        with:
          name: SolutionCompakt-USB-Portable-${{ env.BUILD_VERSION }}-win-x64
          path: artifacts/usb-portable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SolutionCompakt-Setup-${{ env.BUILD_VERSION }}-win-x64
          path: artifacts/installer/*.exe

      - name: Publish installer update channel on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $downloadStage = Join-Path $env:RUNNER_TEMP "solutioncompakt-downloads"
          New-Item -ItemType Directory -Path $downloadStage -Force | Out-Null

          $setup = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer executable not found." }

          $latestZip = Join-Path $downloadStage "SolutionCompakt-Setup-latest.zip"
          Compress-Archive -Path $setup.FullName -DestinationPath $latestZip -Force
          $sha256 = (Get-FileHash $latestZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = $env:BUILD_VERSION
            downloadUrl = "https://raw.githubusercontent.com/Happycupra/KPI-rai/main/downloads/SolutionCompakt-Setup-latest.zip?v=$env:BUILD_VERSION"
            sha256 = $sha256
            publishedAtUtc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $downloadStage "update.json") -Value $manifest -Encoding UTF8

          git fetch origin main
          git checkout -B main origin/main

          New-Item -ItemType Directory -Path downloads -Force | Out-Null
          Copy-Item $latestZip "downloads/SolutionCompakt-Setup-latest.zip" -Force
          Copy-Item (Join-Path $downloadStage "update.json") "downloads/update.json" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SolutionCompakt-Setup-latest.zip downloads/update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish SolutionCompakt $env:BUILD_VERSION update [skip ci]"
            git push origin main
          }
