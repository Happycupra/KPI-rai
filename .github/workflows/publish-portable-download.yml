name: Publish Portable Download

on:
  workflow_run:
    workflows:
      - Windows Build
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-portable-download-main
  cancel-in-progress: true

jobs:
  publish-portable:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download portable artifact from Windows Build
        uses: actions/download-artifact@v4
        with:
          name: SolutionCompakt-Portable-1.0.${{ github.event.workflow_run.run_number }}-win-x64
          path: artifacts/portable
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish portable ZIP to downloads
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/portable/SolutionCompakt.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable not found: $exe" }

          New-Item -ItemType Directory -Path downloads -Force | Out-Null
          $latestZip = Join-Path $PWD "downloads/SolutionCompakt-Portable-latest.zip"
          Compress-Archive -Path $exe -DestinationPath $latestZip -Force

          git fetch origin main
          git checkout -B main origin/main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SolutionCompakt-Portable-latest.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $version = "1.0.${{ github.event.workflow_run.run_number }}"
            git commit -m "Publish SolutionCompakt portable $version [skip ci]"
            git push origin main
          }
