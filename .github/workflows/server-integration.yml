name: PostgreSQL API and SignalR integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres-api-signalr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: solutioncompakt_tests
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solutioncompakt_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise independent clients against real PostgreSQL, HTTP API and SignalR
        env:
          SOLUTIONCOMPAKT_TEST_POSTGRES: Host=localhost;Port=5432;Database=solutioncompakt_tests;Username=postgres;Password=synthetic-test-password
        run: dotnet run --project tests/SolutionCompakt.ServerIntegrationTests --configuration Release
      - name: Build deployable server container
        run: docker build --file src/SolutionCompakt.Server/Dockerfile --tag solutioncompakt-server:ci .
